<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    font:
      12px/1.5 -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    margin: 0;
    padding: 10px;
    color: #2c2c34;
    background: linear-gradient(160deg, #f6f7fb 0%, #eef0f7 100%);
    display: flex;
    flex-direction: column;
  }

  .card {
    background: #fff;
    border: 1px solid #e6e8f0;
    border-radius: 9px;
    padding: 7px 9px;
    box-shadow: 0 1px 2px rgba(30, 34, 60, 0.04);
  }

  #status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    color: #1f2330;
  }

  #dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #e0555b;
    box-shadow: 0 0 0 3px rgba(224, 85, 91, 0.15);
    transition:
      background 0.2s,
      box-shadow 0.2s;
  }

  #dot.on {
    background: #22a06b;
    box-shadow: 0 0 0 3px rgba(34, 160, 107, 0.15);
  }

  #result {
    display: none;
    margin-top: 10px;
    border-top: 1px solid #eceef5;
    padding-top: 9px;
  }

  #result.show {
    display: block;
  }

  .res-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .res-title {
    font-weight: 600;
    font-size: 10px;
    color: #8288a0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .res-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 190px;
    overflow: auto;
  }

  .res-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 7px;
    border: 1px solid #e6e8f0;
    border-radius: 7px;
    background: #fbfcfe;
  }

  .res-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    color: #2c2c34;
  }

  .res-type {
    flex: none;
    font-size: 9px;
    color: #a0a4b0;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .copy-btn {
    flex: none;
    border: 1px solid #d6d9e6;
    background: #fff;
    color: #4b5168;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 10px;
    cursor: pointer;
  }

  /* ---- checkpoint: what changed in the selected frame since the user saved it ---- */
  #cp:empty {
    display: none;
  }
  #cp {
    margin-top: 10px;
    font-size: 11px;
  }
  #cp .res-head {
    margin-bottom: 4px;
    font-size: 10px;
  }
  .cp-bar {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .cp-list {
    max-height: 220px;
    overflow: auto;
    margin-top: 5px;
  }
  .cp-row {
    padding: 3px 5px;
    border-radius: 5px;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .cp-row:hover {
    background: #f0f2f8;
  }

  .copy-btn:hover {
    background: #f0f2f8;
  }

  .copy-btn.done {
    color: #22a06b;
    border-color: #bfe6d3;
    background: #f0faf5;
  }

  .copy-all {
    padding: 1px 6px;
    font-size: 10px;
  }

  .out-close {
    border: none;
    background: none;
    color: #8288a0;
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
  }

  .muted {
    color: #8288a0;
  }

  .k-del {
    color: #d1434b;
    font-weight: 600;
  }

  .k-chg {
    color: #b7791f;
    font-weight: 600;
  }

  .used {
    color: #22a06b;
    font-weight: 600;
  }

  #credit {
    margin-top: auto;
    padding-top: 7px;
    text-align: center;
    color: #a0a4b0;
    font-size: 10px;
  }

  #version {
    color: #8288a0;
  }

  /* ---- read-only switch and activity log ---- */
  #act-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    border-top: 1px solid #eceef5;
    padding-top: 8px;
    font-size: 10.5px;
  }
  #act-head label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  #act-counts {
    flex: 1;
    text-align: right;
    cursor: pointer;
    white-space: nowrap;
  }
  #activity {
    margin-top: 4px;
    font-size: 10.5px;
  }
  #activity:not(.open) {
    display: none;
  }
  .act-row {
    padding: 2px 4px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .act-row[data-id] {
    cursor: pointer;
  }
  .act-row[data-id]:hover {
    background: #f0f2f8;
  }
</style>

<div class="card">
  <div id="status-row" title="Keep open while AI works · run it in every file">
    <span id="dot"></span><span id="status">Connecting…</span>
  </div>
  <div id="result"></div>
  <div id="cp"></div>
  <div id="act-head">
    <label title="Refuse every AI command that would change this file"><input type="checkbox" id="readonly" checked> Read-only</label>
    <span id="act-counts" class="muted" title="Show or hide what the AI did in this file"></span>
    <button id="act-clear" class="out-close" title="Clear the log">×</button>
  </div>
  <div id="activity"></div>
</div>
<div id="credit">
  <span id="version"></span>
</div>

<script>
  // Bridge UI: connect to the shared MCP bridge on localhost and relay
  // frames between it and the plugin main thread.
  //
  // One bridge serves every plugin window and every MCP session, so there is
  // a single well-known port (also the only one the manifest's
  // devAllowedDomains permits). While disconnected we retry on a short loop;
  // background tabs throttle timers, so a visibility change and a click on
  // the status line also trigger an immediate attempt.
  const PORT = 2000,
    RETRY = 1000,
    PROTOCOL = 4; // must match bridge.ProtocolVersion in the Go server
  let ws = null; // open connection, null while disconnected
  let attempt = null; // socket currently trying to connect
  let reg = null; // {key, name} of this file, sent by the main thread
  let protoWarning = null; // set when the server reports a newer protocol

  function setStatus(connected, text) {
    document.getElementById("dot").className = connected ? "on" : "";
    document.getElementById("status").textContent = text;
  }

  function label() {
    if (protoWarning) return protoWarning;
    return reg ? "Connected · " + reg.name : "Connected (port " + PORT + ")";
  }

  function sendRegister() {
    if (ws && ws.readyState === WebSocket.OPEN && reg) {
      // protocol tells the server this window's build, so an error from an
      // outdated plugin can say "re-import" instead of "unknown command".
      ws.send(JSON.stringify({ register: Object.assign({}, reg, { protocol: PROTOCOL }) }));
    }
  }

  function connect() {
    if (ws || attempt) return;
    let sock;
    try {
      sock = new WebSocket("ws://localhost:" + PORT + "/ws");
    } catch (e) {
      schedule();
      return;
    }
    attempt = sock;
    sock.onopen = () => {
      attempt = null;
      ws = sock;
      sendRegister();
      setStatus(true, label());
      cp = { id: null };
      syncCheckpoint();
    };
    sock.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.hello) {
        // Name the side that is behind: a stale server is just as common as
        // a stale plugin, and blaming the plugin sends people re-importing
        // a plugin that was already up to date.
        // Show which server build we are talking to; "dev" means a local
        // go build rather than a release.
        if (msg.hello.version) {
          document.getElementById("version").textContent = "v" + msg.hello.version;
        }
        protoWarning = null;
        if (msg.hello.protocol && msg.hello.protocol !== PROTOCOL) {
          protoWarning =
            msg.hello.protocol < PROTOCOL
              ? "⚠ Server outdated — restart your AI client"
              : "⚠ Plugin outdated — re-import from the latest release";
        }
        setStatus(true, label());
        return;
      }
      if (msg.checkpointResult) return onCheckpointResult(msg.checkpointResult);
      // Relay only commands: the socket must not reach the window's own
      // messages (setReadOnly, uiAction) or a local process could unlock the file.
      if (msg.id && msg.command) {
        parent.postMessage({ pluginMessage: { id: msg.id, command: msg.command, params: msg.params } }, "*");
      }
    };
    sock.onclose = () => {
      if (attempt === sock) attempt = null;
      if (ws === sock) ws = null;
      if (!ws) {
        drawCheckpoint();
        setStatus(false, "Searching for MCP server…");
        schedule();
      }
    };
    sock.onerror = () => {
      try {
        sock.close();
      } catch (e) { }
    };
  }

  let retryTimer = null;
  function schedule() {
    if (retryTimer) return;
    retryTimer = setTimeout(() => {
      retryTimer = null;
      connect();
    }, RETRY);
  }

  // ---- live selection list (name + copyable link) ----
  let selItems = []; // everything currently selected in Figma

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Frames copy as a link block; every other element copies its exported SVG.
  function copyLabelFor(it) {
    return it.type === "FRAME" ? "Copy" : "Copy SVG";
  }

  // Copyable text for one item. Frames use the requested link format:
  //   # <name>:
  //   <link>
  // Other elements return their SVG (or the export error, so the click still
  // gives feedback instead of silently copying nothing).
  function copyValueForItem(it) {
    if (it.type === "FRAME") return "# " + it.name + ":\n" + (it.link || "");
    return it.svg || it.svgError || "";
  }

  function renderSelection(items) {
    if (items) selItems = items;
    drawSelection();
    syncCheckpoint();
  }

  // ---- checkpoint: save the selected frame's design, later ask what changed ----
  // The server keeps the snapshot and does the comparing; this only asks and shows.
  let canEdit = false;
  let cp = { id: null }; // { id, saved, changes, total, busy, error } for the selected node

  function askCheckpoint(op) {
    if (!ws || ws.readyState !== WebSocket.OPEN || !cp.id) return;
    if (op !== "status") cp.busy = op;
    ws.send(JSON.stringify({ checkpoint: { op, node_id: cp.id } }));
    drawCheckpoint();
  }

  function syncCheckpoint() {
    const id = canEdit && selItems.length === 1 ? selItems[0].id : null;
    if (id === cp.id) return;
    cp = { id };
    drawCheckpoint();
    askCheckpoint("status");
  }

  function onCheckpointResult(r) {
    if (r.node_id !== cp.id) return; // the selection moved on
    cp.busy = null;
    cp.error = r.error || null;
    if (r.saved) cp.saved = r.saved;
    if (r.op === "save" && !r.error) cp.changes = null;
    if (r.op === "diff" && !r.error) {
      cp.changes = r.changes || [];
      cp.total = r.total || 0;
    }
    drawCheckpoint();
  }

  const CP_KIND = { "+": ['used', "added"], "-": ['k-del', "removed"], "~": ['k-chg', "changed"] };

  function drawCheckpoint() {
    const box = document.getElementById("cp");
    if (!cp.id || !ws) {
      box.innerHTML = "";
      return fit();
    }
    let html =
      '<div class="res-head"><span class="res-title">Checkpoint</span>' +
      '<span class="muted" title="Saved on this computer; the file is not changed">' +
      (cp.saved ? "Saved " + esc(cp.saved) : "Not saved yet") + "</span></div>" +
      '<div class="cp-bar"><button class="copy-btn" data-cp="save"' + (cp.busy ? " disabled" : "") + ' title="Remember this frame as it is now">' +
      (cp.busy === "save" ? "Saving…" : "Save checkpoint") + "</button>" +
      (cp.saved
        ? '<button class="copy-btn" data-cp="diff"' + (cp.busy ? " disabled" : "") + ' title="What changed in this frame since the checkpoint">' +
          (cp.busy === "diff" ? "Comparing…" : "What changed?") + "</button>"
        : "") +
      "</div>";
    if (cp.error) html += '<div class="k-del">' + esc(cp.error) + "</div>";
    else if (cp.changes) {
      html += cp.changes.length
        ? '<div class="cp-list">' +
          cp.changes.map((c) => {
            const k = CP_KIND[c.kind] || ["muted", ""];
            return '<div class="cp-row" data-id="' + esc(c.id) + '" title="Show this layer"><span class="' + k[0] + '">' + k[1] +
              "</span> <b>" + esc(c.name) + "</b>" + (c.detail ? ' <span class="muted">' + esc(c.detail) + "</span>" : "") + "</div>";
          }).join("") +
          "</div>" +
          (cp.total > cp.changes.length ? '<div class="muted">First ' + cp.changes.length + " of " + cp.total + " changes.</div>" : "")
        : '<div class="used">No changes since the checkpoint.</div>';
    }
    box.innerHTML = html;
    fit();
  }

  document.getElementById("cp").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cp]");
    if (btn) return askCheckpoint(btn.dataset.cp);
    const row = e.target.closest(".cp-row");
    // A removed layer no longer exists; the plugin ignores a select it cannot do.
    if (row) parent.postMessage({ pluginMessage: { uiAction: "select", nodeId: row.dataset.id } }, "*");
  });

  function drawSelection() {
    const box = document.getElementById("result");
    if (!selItems.length) {
      box.className = "";
      box.innerHTML = "";
      fit();
      return;
    }
    const head =
      '<div class="res-head"><span class="res-title">Selected (' + selItems.length + ")</span>" +
      (selItems.length > 1 ? '<button class="copy-btn copy-all" data-all="1">Copy all</button>' : "") +
      "</div>";

    const body =
      '<div class="res-list">' +
      selItems
        .map(
          (it, i) =>
            '<div class="res-row">' +
            '<span class="res-name" title="' + esc(it.name) + '">' + esc(it.name) + "</span>" +
            '<span class="res-type">' + esc(it.type) + "</span>" +
            '<button class="copy-btn" data-i="' + i + '">' + copyLabelFor(it) + "</button>" +
            "</div>",
        )
        .join("") +
      "</div>";

    box.innerHTML = head + body;
    box.className = "show";
    fit();
  }

  // Ask the main thread to size the window to its content.
  function fit() {
    requestAnimationFrame(() => {
      const card = document.querySelector(".card");
      const credit = document.getElementById("credit");
      const h = card.getBoundingClientRect().bottom + credit.offsetHeight + 12;
      parent.postMessage({ pluginMessage: { resize: h } }, "*");
    });
  }

  // What each button copies: a row copies its own value (link block for a
  // frame, SVG otherwise); "Copy all" joins every item with a blank line between.
  function copyValueFor(btn) {
    if (btn.hasAttribute("data-all")) {
      return selItems.map(copyValueForItem).join("\n\n");
    }
    const it = selItems[+btn.getAttribute("data-i")];
    return it ? copyValueForItem(it) : "";
  }

  // navigator.clipboard is often unavailable in the plugin iframe, so use the
  // textarea + execCommand fallback which works reliably here.
  function copyText(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
    } catch (e) { }
    document.body.removeChild(ta);
  }

  document.getElementById("result").addEventListener("click", (e) => {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;
    copyText(copyValueFor(btn));
    const old = btn.textContent;
    btn.textContent = "Copied";
    btn.classList.add("done");
    setTimeout(() => {
      btn.textContent = old;
      btn.classList.remove("done");
    }, 1200);
  });

  // ---- activity log: what the AI did in this file, newest first ----
  let acts = [];
  let counts = { read: 0, write: 0, error: 0 };

  function logActivity(a) {
    counts[a.error ? "error" : a.write ? "write" : "read"]++;
    acts.unshift(Object.assign({ time: new Date().toTimeString().slice(0, 8) }, a));
    acts = acts.slice(0, 5);
    renderActivity();
  }

  function renderActivity() {
    const open = document.getElementById("activity").classList.contains("open");
    const parts = [];
    if (counts.read) parts.push(counts.read + " read");
    if (counts.write) parts.push(counts.write + " write");
    if (counts.error) parts.push('<span class="k-del">' + counts.error + " error</span>");
    document.getElementById("act-counts").innerHTML =
      "AI: " + (parts.join(" · ") || "no activity") + (open ? " ▾" : " ▸");
    document.getElementById("activity").innerHTML = acts
      .map((a) =>
        '<div class="act-row"' + (a.node && !a.error ? ' data-id="' + esc(a.node) + '"' : "") + ' title="' + esc(a.error || a.command) + '">' +
        '<span class="muted">' + a.time + "</span> " +
        (a.error ? '<span class="k-del">✗</span> ' : '<span class="used">✓</span> ') + esc(a.command) +
        (a.write && !a.error ? ' <span class="k-chg">edit</span>' : "") +
        (a.error ? ' <span class="muted">' + esc(a.error) + "</span>" : "") +
        "</div>")
      .join("");
    fit();
  }

  document.getElementById("readonly").onchange = (e) =>
    parent.postMessage({ pluginMessage: { setReadOnly: e.target.checked } }, "*");
  document.getElementById("act-clear").onclick = () => {
    acts = [];
    counts = { read: 0, write: 0, error: 0 };
    renderActivity();
  };
  document.getElementById("act-counts").onclick = () => {
    document.getElementById("activity").classList.toggle("open");
    renderActivity();
  };
  renderActivity();
  document.getElementById("activity").addEventListener("click", (e) => {
    const row = e.target.closest(".act-row[data-id]");
    if (row) parent.postMessage({ pluginMessage: { uiAction: "select", nodeId: row.dataset.id } }, "*");
  });

  // Relay plugin main-thread frames: the register frame is cached here and
  // re-sent on every reconnect, the selection frame drives the list above, and
  // everything else goes to the server.
  window.onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.register) {
      reg = msg.register;
      sendRegister();
      if (ws) setStatus(true, label());
      return;
    }
    if (Array.isArray(msg.selection)) {
      renderSelection(msg.selection);
      return;
    }
    if (msg.activity) {
      logActivity(msg.activity);
      return;
    }
    if (msg.canEdit !== undefined) {
      canEdit = msg.canEdit;
      cp = { id: null };
      syncCheckpoint();
      return;
    }
    if (msg.readOnly !== undefined) {
      document.getElementById("readonly").checked = msg.readOnly;
      return;
    }
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    }
  };

  document.getElementById("status-row").onclick = () => connect();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !ws) connect();
  });

  connect();
  fit();
</script>
