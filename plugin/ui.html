<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #ffffff; --fg: #141414; --muted: #737373; --line: #ededed; --soft: #f5f5f5; --card: #ffffff;
    --ok: #1f9d57; --wait: #d98a00; --bad: #d93838; --bad-bg: #fdecec; --accent: #d9480f; --accent-bg: #fff1e7;
    --track: #cfcfcf; --on: #141414; --on-fg: #ffffff;
  }
  /* "dark" is set by applyTheme(): Figma's own theme (figma-dark on <html>,
     from showUI themeColors) unless the user picked one with the footer button. */
  .dark {
    --bg: #2c2c2c; --fg: #f4f4f4; --muted: #9c9c9c; --line: #3d3d3d; --soft: #383838; --card: #303030;
    --ok: #4ccf85; --wait: #f0b840; --bad: #ff7070; --bad-bg: #402626; --accent: #ff9458; --accent-bg: #3d2a1e;
    --track: #5c5c5c; --on: #f4f4f4; --on-fg: #141414;
  }
  html, body { margin: 0; }
  body { font: 13px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  [hidden] { display: none !important; }

  .sec { padding: 14px 16px; }
  .sec + .sec { border-top: 1px solid var(--line); }
  /* A notice belongs to the header above it: no rule between them, no double padding. */
  #notice { border-top: 0; padding-top: 0; }
  .hd, .row { display: flex; align-items: center; gap: 12px; }
  .ttl, .t { flex: 1; min-width: 0; }
  .ttl b { display: block; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttl span, .t span { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t span.warn { color: var(--accent); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; flex: none; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  #dot.ok { background: var(--ok); }
  #dot.wait { background: var(--wait); animation: pulse 1.3s ease-in-out infinite; }
  #dot.busy { background: var(--accent); animation: pulse 0.7s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { #dot { animation: none !important; } }

  .ib { width: 28px; height: 28px; border: 0; background: none; color: var(--muted); border-radius: 7px; display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; margin-right: -6px; }
  .ib:hover { background: var(--soft); color: var(--fg); }
  .ib svg { width: 16px; height: 16px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .sw { width: 38px; height: 22px; border-radius: 99px; border: 0; background: var(--track); position: relative; cursor: pointer; padding: 0; flex: none; transition: background 0.15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
  .sw[aria-checked="true"] { background: var(--ok); }
  .sw[aria-checked="true"]::after { transform: translateX(16px); }

  .h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .h b { font-size: 13.5px; font-weight: 650; }
  .h i { font-style: normal; color: var(--muted); }
  .h .r { margin-left: auto; color: var(--muted); font-size: 12.5px; border: 0; background: none; font-family: inherit; cursor: pointer; padding: 0; }
  .h .r:hover { color: var(--fg); }
  .h.flat { margin-bottom: 0; }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: auto; max-height: 232px; }
  .li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .li + .li { border-top: 1px solid var(--line); }
  .li[data-id] { cursor: pointer; }
  .li[data-id]:hover { background: var(--soft); }
  .li.err .t span, .bad-text { color: var(--bad); }
  .chip { height: 26px; padding: 0 10px; border-radius: 8px; border: 0; font: inherit; font-size: 12.5px; font-weight: 600; background: var(--soft); color: var(--fg); cursor: pointer; white-space: nowrap; flex: none; }
  .chip:hover { filter: brightness(0.96); }
  .chip.done { color: var(--ok); }
  .tag { height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; flex: none; background: var(--accent-bg); color: var(--accent); }
  .tag.add { background: none; color: var(--ok); padding: 0; }
  .tag.del { background: none; color: var(--bad); padding: 0; }
  .tag.chg { background: none; color: var(--accent); padding: 0; }
  .tm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .more { margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
  .b { height: 32px; padding: 0 14px; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; }
  .b:hover { background: var(--soft); }
  .b:disabled { opacity: 0.55; cursor: default; }
  .b.pri { background: var(--on); border-color: var(--on); color: var(--on-fg); }
  .b.pri:hover { filter: brightness(1.15); background: var(--on); }
  .b.txt { border-color: transparent; background: none; color: var(--muted); font-weight: 500; padding: 0 8px; }
  .b.wide { width: 100%; justify-content: center; }
  .msg { border-radius: 12px; padding: 12px; background: var(--accent-bg); }
  .msg.bad { background: var(--bad-bg); }
  .msg b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .msg p { margin: 0 0 10px; font-size: 12.5px; opacity: 0.85; overflow-wrap: anywhere; }
  .msg .a { display: flex; gap: 6px; }
  .msg code { font: 12px ui-monospace, Menlo, monospace; }
  .cp-list { margin-top: 10px; }
  .foot { display: flex; padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .foot { align-items: center; }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot .ib { margin: -6px 6px -6px auto; width: 24px; height: 24px; }
  .foot .ib svg { width: 14px; height: 14px; }
  .foot a:hover { color: var(--fg); }
</style>

<div id="app">
  <div class="sec">
    <div class="hd">
      <div class="ttl"><b id="file">Figma file</b><span id="page"></span></div>
      <span class="st"><span id="dot" class="wait"></span><span id="status">Searching</span></span>
      <button class="ib" id="min" aria-label="Minimize" title="Minimize"></button>
    </div>
  </div>
  <div id="body">
    <div class="sec" id="notice" hidden></div>
    <div class="sec">
      <div class="row">
        <div class="t"><b>Read-only</b><span id="ro-note" class="warn" hidden>AI can change this file</span></div>
        <button class="sw" id="readonly" role="switch" aria-checked="true" aria-label="Read-only" title="Refuse every AI command that would change this file"></button>
      </div>
    </div>
    <div class="sec" id="retry-sec" hidden><button class="b wide" id="retry">Retry now</button></div>
    <div class="sec" id="sel-sec" hidden>
      <div class="h"><b>Selection</b><i id="sel-count"></i><button class="r" id="copy-all" hidden>Copy all</button></div>
      <div class="card" id="result"></div>
      <div id="cp"></div>
    </div>
    <div class="sec">
      <div class="h flat" id="act-h"><b>AI activity</b><button class="r" id="act-counts" title="Show or hide what the AI did in this file"></button></div>
      <div id="act-box" hidden>
        <div class="card" id="activity"></div>
        <div class="more"><button class="b txt" id="act-clear" style="padding:0">Clear log</button></div>
      </div>
    </div>
    <div class="foot"><span id="version"></span><button class="ib" id="theme"></button><a href="https://github.com/hoangann2000/figma-mcp-console#readme" target="_blank">Help</a></div>
  </div>
</div>

<script>
  // Bridge UI: connect to the shared MCP bridge on localhost and relay
  // frames between it and the plugin main thread.
  //
  // One bridge serves every plugin window and every MCP session, so there is
  // a single well-known port (also the only one the manifest's
  // devAllowedDomains permits). While disconnected we retry on a short loop;
  // background tabs throttle timers, so a visibility change and the Retry
  // button also trigger an immediate attempt.
  const PORT = 2000,
    RETRY = 1000,
    PROTOCOL = 6; // must match bridge.ProtocolVersion in the Go server
  const RELEASES = "https://github.com/hoangann2000/figma-mcp-console/releases/latest";
  const $ = (id) => document.getElementById(id);
  let ws = null; // open connection, null while disconnected
  let attempt = null; // socket currently trying to connect
  let reg = null; // {key, name, read_only} of this file, sent by the main thread
  let page = ""; // name of the page open in Figma
  let behind = null; // "plugin" or "server": the side with the older protocol
  let serverVersion = "";
  let working = null; // write command running right now
  let blocked = null; // last command refused by Read-only, until dismissed
  let minimized = false;

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // "create_frame" -> "Create frame": the log is read by people.
  function human(command) {
    const s = String(command).replace(/_/g, " ");
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  const ICON_UP = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>';
  const ICON_DOWN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';

  // Header, notice and visibility all follow from the state above.
  function paint() {
    const connected = !!ws;
    $("file").textContent = reg ? reg.name : "Figma file";
    $("page").textContent = !connected ? "Waiting for your AI client" : page;
    let dot = "ok", word = "Connected";
    if (!connected) { dot = "wait"; word = "Searching"; }
    else if (behind) { dot = ""; word = "Outdated"; }
    else if (working) { dot = "busy"; word = "Editing"; }
    $("dot").className = dot;
    $("status").textContent = word;
    // "dev" is a local build, not a version anyone can look up.
    const version = serverVersion && serverVersion !== "dev" ? "v" + serverVersion : "";
    $("version").textContent = version;
    $("retry-sec").hidden = connected;

    // One notice at a time; a version mismatch outranks a blocked edit.
    const n = $("notice");
    let html = "";
    if (connected && behind === "plugin") {
      html = '<div class="msg bad"><b>Update the plugin</b><p>The server' + (version ? " (" + esc(version) + ")" : "") +
        " is newer than this plugin.</p>" +
        '<div class="a"><a class="b pri" href="' + RELEASES + '" target="_blank">Get the new plugin</a></div></div>';
    } else if (connected && behind === "server") {
      html = '<div class="msg bad"><b>Restart your AI client</b><p style="margin:0">The server' + (version ? " (" + esc(version) + ")" : "") +
        " is older than this plugin.</p></div>";
    } else if (blocked) {
      html = '<div class="msg"><b>AI tried to edit this file</b><p>Blocked: <code>' + esc(blocked) +
        "</code>. Turn off Read-only if the edit is intended, then ask the AI again.</p>" +
        '<div class="a"><button class="b pri" data-act="allow">Allow edits</button><button class="b txt" data-act="dismiss">Dismiss</button></div></div>';
    }
    n.innerHTML = html;
    n.hidden = !html;

    $("body").hidden = minimized;
    $("min").innerHTML = minimized ? ICON_DOWN : ICON_UP;
    $("min").title = minimized ? "Expand" : "Minimize";
    $("min").setAttribute("aria-label", $("min").title);
    fit();
  }

  function sendRegister() {
    if (ws && ws.readyState === WebSocket.OPEN && reg) {
      // protocol tells the server this window's build, so an error from an
      // outdated plugin can say "re-import" instead of "unknown command".
      ws.send(JSON.stringify({ register: Object.assign({}, reg, { protocol: PROTOCOL }) }));
    }
  }

  function connect() {
    if (ws || attempt) return;
    let sock;
    try {
      sock = new WebSocket("ws://localhost:" + PORT + "/ws");
    } catch (e) {
      schedule();
      return;
    }
    attempt = sock;
    sock.onopen = () => {
      attempt = null;
      ws = sock;
      sendRegister();
      paint();
      cp = { id: null };
      syncCheckpoint();
    };
    sock.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.hello) {
        // Name the side that is behind: a stale server is just as common as
        // a stale plugin, and blaming the plugin sends people re-importing
        // a plugin that was already up to date. "dev" as the version means a
        // local go build rather than a release.
        serverVersion = msg.hello.version || "";
        behind = null;
        if (msg.hello.protocol && msg.hello.protocol !== PROTOCOL) {
          behind = msg.hello.protocol < PROTOCOL ? "server" : "plugin";
        }
        paint();
        return;
      }
      if (msg.checkpointResult) return onCheckpointResult(msg.checkpointResult);
      // Relay only commands: the socket must not reach the window's own
      // messages (setReadOnly, uiAction) or a local process could unlock the file.
      if (msg.id && msg.command) {
        parent.postMessage({ pluginMessage: { id: msg.id, command: msg.command, params: msg.params } }, "*");
      }
    };
    sock.onclose = () => {
      if (attempt === sock) attempt = null;
      if (ws === sock) ws = null;
      if (!ws) {
        working = null;
        behind = null;
        drawCheckpoint();
        paint();
        schedule();
      }
    };
    sock.onerror = () => {
      try {
        sock.close();
      } catch (e) { }
    };
  }

  let retryTimer = null;
  function schedule() {
    if (retryTimer) return;
    retryTimer = setTimeout(() => {
      retryTimer = null;
      connect();
    }, RETRY);
  }

  // ---- live selection list (name + copyable link) ----
  let selItems = []; // everything currently selected in Figma

  // Frames copy as a link block; every other element copies its exported SVG.
  function copyLabelFor(it) {
    return it.type === "FRAME" ? "Copy link" : "Copy SVG";
  }

  // Copyable text for one item. Frames use the requested link format:
  //   # <name>:
  //   <link>
  // Other elements return their SVG (or the export error, so the click still
  // gives feedback instead of silently copying nothing).
  function copyValueForItem(it) {
    if (it.type === "FRAME") return "# " + it.name + ":\n" + (it.link || "");
    return it.svg || it.svgError || "";
  }

  function kindOf(it) {
    const t = String(it.type || "");
    const kind = t.charAt(0) + t.slice(1).toLowerCase().replace(/_/g, " ");
    return it.width !== undefined ? kind + " · " + it.width + " × " + it.height : kind;
  }

  function renderSelection(items) {
    if (items) selItems = items;
    drawSelection();
    syncCheckpoint();
  }

  // ---- checkpoint: save the selected frame's design, later ask what changed ----
  // The server keeps the snapshot and does the comparing; this only asks and shows.
  let canEdit = false;
  let cp = { id: null }; // { id, saved, changes, total, busy, error } for the selected node

  function askCheckpoint(op) {
    if (!ws || ws.readyState !== WebSocket.OPEN || !cp.id) return;
    if (op !== "status") cp.busy = op;
    ws.send(JSON.stringify({ checkpoint: { op, node_id: cp.id } }));
    drawCheckpoint();
  }

  function syncCheckpoint() {
    const id = canEdit && selItems.length === 1 ? selItems[0].id : null;
    if (id === cp.id) return;
    cp = { id };
    drawCheckpoint();
    askCheckpoint("status");
  }

  function onCheckpointResult(r) {
    if (r.node_id !== cp.id) return; // the selection moved on
    cp.busy = null;
    cp.error = r.error || null;
    if (r.saved) cp.saved = r.saved;
    if (r.op === "save" && !r.error) cp.changes = null;
    if (r.op === "diff" && !r.error) {
      cp.changes = r.changes || [];
      cp.total = r.total || 0;
    }
    drawCheckpoint();
  }

  // "2026-11-22 09:53" -> "22 Nov 09:53"
  function shortDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s || "");
    if (!m) return s || "";
    return +m[3] + " " + ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][+m[2] - 1] + " " + m[4];
  }

  const CP_KIND = { "+": ["add", "Added"], "-": ["del", "Removed"], "~": ["chg", "Changed"] };

  function drawCheckpoint() {
    const box = $("cp");
    if (!cp.id || !ws) {
      box.innerHTML = "";
      return fit();
    }
    let html =
      '<div class="more"><button class="b" data-cp="save"' + (cp.busy ? " disabled" : "") + ' title="Remember this frame as it is now. Saved on this computer; the file is not changed">' +
      (cp.busy === "save" ? "Saving…" : "Save checkpoint") + "</button>" +
      (cp.saved
        ? '<button class="b" data-cp="diff"' + (cp.busy ? " disabled" : "") + ' title="What changed in this frame since the checkpoint">' +
          (cp.busy === "diff" ? "Comparing…" : "What changed?") + "</button>"
        : "") +
      "<span>" + (cp.saved ? "Saved " + esc(shortDate(cp.saved)) : "No checkpoint yet") +
      (cp.changes && !cp.changes.length && !cp.error ? " · no changes" : "") + "</span></div>";
    if (cp.error) html += '<div class="more bad-text">' + esc(cp.error) + "</div>";
    else if (cp.changes) {
      html += cp.changes.length
        ? '<div class="card cp-list">' +
          cp.changes.map((c) => {
            const k = CP_KIND[c.kind] || ["", ""];
            return '<div class="li" data-id="' + esc(c.id) + '" title="Show this layer"><div class="t"><b>' + esc(c.name) + "</b>" +
              (c.detail ? "<span>" + esc(c.detail) + "</span>" : "") + '</div><span class="tag ' + k[0] + '">' + k[1] + "</span></div>";
          }).join("") +
          "</div>" +
          (cp.total > cp.changes.length ? '<div class="more">First ' + cp.changes.length + " of " + cp.total + " changes.</div>" : "")
        : "";
    }
    box.innerHTML = html;
    fit();
  }

  $("cp").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cp]");
    if (btn) return askCheckpoint(btn.dataset.cp);
    const row = e.target.closest(".li[data-id]");
    // A removed layer no longer exists; the plugin ignores a select it cannot do.
    if (row) parent.postMessage({ pluginMessage: { uiAction: "select", nodeId: row.dataset.id } }, "*");
  });

  function drawSelection() {
    $("sel-sec").hidden = !selItems.length;
    $("sel-count").textContent = selItems.length > 1 ? selItems.length : "";
    $("copy-all").hidden = selItems.length < 2;
    $("result").innerHTML = selItems
      .map(
        (it, i) =>
          '<div class="li"><div class="t"><b title="' + esc(it.name) + '">' + esc(it.name) + "</b><span>" + esc(kindOf(it)) + "</span></div>" +
          '<button class="chip" data-i="' + i + '">' + copyLabelFor(it) + "</button></div>",
      )
      .join("");
    fit();
  }

  // Ask the main thread to size the window to its content.
  function fit() {
    requestAnimationFrame(() => {
      parent.postMessage({ pluginMessage: { resize: $("app").getBoundingClientRect().bottom } }, "*");
    });
  }

  // navigator.clipboard is often unavailable in the plugin iframe, so use the
  // textarea + execCommand fallback which works reliably here.
  function copyText(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
    } catch (e) { }
    document.body.removeChild(ta);
  }

  // A row copies its own value (link block for a frame, SVG otherwise);
  // "Copy all" joins every item with a blank line between.
  function copied(btn, text) {
    copyText(text);
    const old = btn.textContent;
    btn.textContent = "Copied";
    btn.classList.add("done");
    setTimeout(() => {
      btn.textContent = old;
      btn.classList.remove("done");
    }, 1200);
  }
  $("result").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    const it = btn && selItems[+btn.dataset.i];
    if (it) copied(btn, copyValueForItem(it));
  });
  $("copy-all").onclick = (e) => copied(e.target, selItems.map(copyValueForItem).join("\n\n"));

  // ---- activity log: what the AI did in this file, newest first ----
  let acts = [];
  let counts = { read: 0, write: 0, error: 0, blocked: 0 };
  let actOpen = false;

  function logActivity(a) {
    working = null;
    counts[a.blocked ? "blocked" : a.error ? "error" : a.write ? "write" : "read"]++;
    if (a.blocked) blocked = a.command;
    acts.unshift(Object.assign({ time: new Date().toTimeString().slice(0, 5) }, a));
    acts = acts.slice(0, 20);
    renderActivity();
    paint();
  }

  function renderActivity() {
    const parts = [];
    if (counts.read) parts.push(counts.read + " read");
    if (counts.write) parts.push(counts.write + " edit");
    if (counts.blocked) parts.push(counts.blocked + " blocked");
    if (counts.error) parts.push(counts.error + " failed");
    const total = counts.read + counts.write + counts.blocked + counts.error;
    $("act-counts").textContent = total ? parts.join(" · ") + (actOpen ? " ⌄" : " ›") : "Nothing yet";
    $("act-counts").disabled = !total;
    $("act-box").hidden = !actOpen || !total;
    $("act-h").classList.toggle("flat", !actOpen || !total);
    $("activity").innerHTML = acts
      .map((a) => {
        const failed = !!a.error;
        const sub = a.blocked ? "Blocked by Read-only" : failed ? a.error : a.name || "";
        return '<div class="li' + (failed ? " err" : "") + '"' + (a.node && !failed ? ' data-id="' + esc(a.node) + '"' : "") +
          ' title="' + esc(a.error || a.command) + '"><div class="t"><b>' + esc(human(a.command)) + "</b>" +
          (sub ? "<span>" + esc(sub) + "</span>" : "") + "</div>" +
          (a.write && !failed ? '<span class="tag">Edit</span>' : "") +
          '<span class="tm">' + a.time + "</span></div>";
      })
      .join("");
    fit();
  }

  // ---- Read-only switch: the main thread enforces it, this only asks ----
  function showReadOnly(on) {
    $("readonly").setAttribute("aria-checked", on ? "true" : "false");
    $("ro-note").hidden = on; // the warning matters only while edits are allowed
  }
  function setReadOnly(on) {
    showReadOnly(on);
    if (!on) blocked = null;
    parent.postMessage({ pluginMessage: { setReadOnly: on } }, "*");
    paint();
  }
  $("readonly").onclick = () => setReadOnly($("readonly").getAttribute("aria-checked") !== "true");
  $("notice").addEventListener("click", (e) => {
    const act = e.target.dataset && e.target.dataset.act;
    if (act === "allow") setReadOnly(false);
    if (act === "dismiss") { blocked = null; paint(); }
  });

  $("act-clear").onclick = () => {
    acts = [];
    counts = { read: 0, write: 0, error: 0, blocked: 0 };
    actOpen = false;
    renderActivity();
  };
  $("act-counts").onclick = () => {
    actOpen = !actOpen;
    renderActivity();
  };
  $("activity").addEventListener("click", (e) => {
    const row = e.target.closest(".li[data-id]");
    if (row) parent.postMessage({ pluginMessage: { uiAction: "select", nodeId: row.dataset.id } }, "*");
  });
  $("min").onclick = () => {
    minimized = !minimized;
    paint();
  };
  $("retry").onclick = () => connect();

  // ---- theme: follows Figma until the user picks one; the choice is kept ----
  const ICON_MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.500 5.500 0 1 0 6.500 6.500z"/></svg>';
  const ICON_SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.800"/><path d="M8 1.500v1.500M8 13v1.500M1.500 8H3M13 8h1.500M3.400 3.400l1.100 1.100M11.500 11.500l1.100 1.100M3.400 12.600l1.100-1.100M11.500 4.500l1.100-1.100"/></svg>';
  const root = document.documentElement;
  let theme = "auto"; // auto | light | dark
  const figmaDark = () => root.classList.contains("figma-dark");
  function applyTheme() {
    const dark = theme === "auto" ? figmaDark() : theme === "dark";
    root.classList.toggle("dark", dark);
    const t = $("theme");
    t.innerHTML = dark ? ICON_SUN : ICON_MOON;
    t.title = dark ? "Switch to light" : "Switch to dark";
    t.setAttribute("aria-label", t.title);
  }
  $("theme").onclick = () => {
    const want = root.classList.contains("dark") ? "light" : "dark";
    // Picking what Figma already uses goes back to following Figma.
    theme = want === (figmaDark() ? "dark" : "light") ? "auto" : want;
    applyTheme();
    parent.postMessage({ pluginMessage: { setTheme: theme } }, "*");
  };
  // Figma swaps figma-light / figma-dark on <html> when its theme changes.
  new MutationObserver(() => {
    const dark = theme === "auto" ? figmaDark() : theme === "dark";
    if (dark !== root.classList.contains("dark")) applyTheme();
  }).observe(root, { attributes: true, attributeFilter: ["class"] });
  applyTheme();

  // Relay plugin main-thread frames: the register frame is cached here and
  // re-sent on every reconnect, the selection frame drives the list above, and
  // everything else goes to the server.
  window.onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.register) {
      reg = msg.register;
      sendRegister();
      showReadOnly(reg.read_only !== false);
      paint();
      return;
    }
    if (msg.theme !== undefined) {
      theme = msg.theme === "light" || msg.theme === "dark" ? msg.theme : "auto";
      applyTheme();
      return;
    }
    if (msg.page !== undefined) {
      page = msg.page;
      paint();
      return;
    }
    if (msg.working !== undefined) {
      working = msg.working;
      paint();
      return;
    }
    if (Array.isArray(msg.selection)) {
      renderSelection(msg.selection);
      return;
    }
    if (msg.activity) {
      logActivity(msg.activity);
      return;
    }
    if (msg.canEdit !== undefined) {
      canEdit = msg.canEdit;
      cp = { id: null };
      syncCheckpoint();
      return;
    }
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    }
  };

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !ws) connect();
  });

  connect();
  renderActivity();
  paint();
</script>
