name: release

# On pushing tag vX.Y.Z → package plugin/ into plugin.zip and create a GitHub Release.
# (Binaries are distributed via npm; no build needed here.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag on broken code, or one that disagrees with the npm version, must not ship a plugin.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --check plugin/code.js
      - name: Tag must match npm/package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./npm/package.json').version")"

      - name: Package Figma plugin
        run: cd plugin && zip -r ../plugin.zip .

      - name: Create GitHub release with plugin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" plugin.zip --title "${GITHUB_REF_NAME}" --generate-notes
